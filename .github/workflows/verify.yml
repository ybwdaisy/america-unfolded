name: Atlas and analytics release checks
on:
  pull_request:
  push:
    branches: [main, feat/historical-atlas]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run funnels:contract
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Offline analytics gating and product contract
        run: npm run test:analytics
